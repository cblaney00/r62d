<!doctype html><html><head><meta charset="utf-8"><title>3D operators</title>
<style>html,body{margin:0;background:#9fb6c8;overflow:hidden}canvas{display:block}#t{position:fixed;left:8px;top:6px;font:600 14px sans-serif;color:#123}</style></head>
<body><div id="t"></div><script type="module">
// A look at the 3D operator models (the rope view's), several at once. ?ops=ember,kestrel&pose=stand&view=front|back|side|turn
import * as THREE from './js/vendor/three.module.min.js';
import { makeOperator } from './js/opmodel3d.js';
import { OPERATORS } from '/shared/operators.js';
const Q = new URLSearchParams(location.search), all = Object.keys(OPERATORS);
const from = +(Q.get('from') || 0), n = +(Q.get('n') || 8);
const ops = Q.get('ops') ? Q.get('ops').split(',') : all.slice(from, from + n), pose = Q.get('pose') || 'stand', view = Q.get('view') || 'front';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color('#9fb6c8');
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.12; { const cv = document.createElement('canvas'); cv.width = 64; cv.height = 256; const x = cv.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#728290'); g.addColorStop(0.5, '#b4c6d4'); g.addColorStop(0.53, '#6a675c'); g.addColorStop(1, '#3a3a34'); x.fillStyle = g; x.fillRect(0, 0, 64, 256); const t = new THREE.CanvasTexture(cv); t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace; sc.background = t; sc.environment = new THREE.PMREMGenerator(r).fromEquirectangular(t).texture; sc.environmentIntensity = 0.7; }
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
sc.add(new THREE.HemisphereLight('#dfe9f2', '#4a4a40', 1.6)); const sun = new THREE.DirectionalLight('#fff1d6', 2.0); sun.position.set(4, 5, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 }); sun.shadow.bias = -0.0004; sc.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#8a6a46', roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; sc.add(floor);
const cols = Math.min(ops.length, Q.get('cols') ? +Q.get('cols') : 4), rows = Math.ceil(ops.length / cols), models = [];
ops.forEach((op, i) => { const m = makeOperator(op); m.pose(pose, +(Q.get('t') || 0), +(Q.get('mv') || 0), +(Q.get('aim') || 0), +(Q.get('lean') || 0), +(Q.get('sprint') || 0)); const c = i % cols, rw = Math.floor(i / cols); m.position.set(0, 0, (c - (cols - 1) / 2) * 0.9); m.position.x = -rw * 1.4; m.rotation.y = view === 'back' ? Math.PI : view === 'side' ? -Math.PI / 2 : view === 'quarter' ? -0.75 : view === 'quarterL' ? 0.75 : 0; m.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; }); sc.add(m); models.push(m); });
document.getElementById('t').textContent = ops.join(' · ') + ' — ' + pose;
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
const w = cols * 0.9, d = Math.max(w * 1.25, rows * 1.9 + 1.6); cam.position.set(d, 1.2 + rows * 0.55, 0); cam.lookAt(-(rows - 1) * 0.7, 0.95, 0);

let t0 = performance.now();
function frame(now) { const t = (now - t0) / 1000; if (view === 'turn') models.forEach(m => m.rotation.y = t * 0.8); if (Q.get('walk')) models.forEach(m => m.pose(pose, t, 1, +(Q.get('aim') || 0), 0, +(Q.get('sprint') || 0))); r.render(sc, cam); requestAnimationFrame(frame); }
requestAnimationFrame(frame); window.__ready = true;
</script></body></html>
