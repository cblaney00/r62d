<!doctype html>
<!-- A gallery of how things look, drawn big by the game's own sprite code: ?show=ops (every operator, ally and enemy)
     or ?show=gadgets (every ability's gadget, as your team sees it and as the enemy does). -->
<html><head><meta charset="utf-8"><title>R62D looks</title>
<style>html,body{margin:0;background:#15181b;color:#dfe6e0;font:600 13px 'Barlow Condensed',sans-serif;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
import { drawOperator, drawGadget } from './js/sprites.js';
import { setPersp } from './js/look.js';
// ?persp=0.15 (how strong), &eye=60 (how far below each one the eye is), &walk=1, &pose=crouch|prone|lean, &aim=deg, &tilt=deg (CSS tilt like the game)
const QP = new URLSearchParams(location.search), PH = +(QP.get('persp') || 0), EYE = +(QP.get('eye') || 60), POSE = QP.get('pose') || '', AIM = (QP.get('aim') !== null ? +QP.get('aim') : -90) * Math.PI / 180;
if (QP.get('tilt')) { document.body.style.perspective = '1400px'; document.getElementById('c').style.transform = `rotateX(${QP.get('tilt')}deg) scale(1.15)`; }
import { OPERATORS, OP_LIST } from '../shared/operators.js';
const c = document.getElementById('c'), ctx = c.getContext('2d');
const show = new URLSearchParams(location.search).get('show') || 'ops';
const fit = () => { c.width = innerWidth; c.height = innerHeight; }; fit(); addEventListener('resize', fit);
// gadgets: one entity per ability (what useAbility puts down), drawn for your team (left) and for the enemy (right)
const GAD = [['jammer', 'VEIL jammer'], ['mine', 'LYNX paint trap'], ['prox', 'BRAMBLE charge'], ['concuss', 'GRAVEL daze mine'], ['clamp', 'SNARE trap'], ['sensor', 'SHADE microphone'],
  ['grid', 'SHUNT static grid'], ['plates', 'RAMPART armor bag', { c: 4 }], ['pace', 'RALLY pace beacon'], ['sticky', 'SALVO round (stuck)', { st: 1 }], ['saw', 'TORQUE saw disc'], ['spike', 'ECHO seismic spike'],
  ['alarm', 'LATCH siren wire'], ['echobox', 'RUSE echo box'], ['radar', 'AUDIT drone radar'], ['station', 'TONIC heal station'], ['healzone', 'PATCH field kit'], ['catcher', 'WARD grenade catcher'],
  ['dart', 'HOUND spotter dart'], ['scope', 'TETHER wall scope (shield)', { sh: 1 }], ['cluster', 'cluster charge'], ['cover', 'TRENCH cover'], ['cutter', 'cutter'], ['wire', 'barbed wire']]
  .map(([ty, label, x]) => ({ label, e: { ty, ag: 0, ...(x || {}) } }));
function frame(ms) {
  const t = ms / 1000, W = c.width, H = c.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#2b2c2a'; ctx.fillRect(0, 0, W, H);
  const from = +(new URLSearchParams(location.search).get('from') || 0), n = +(new URLSearchParams(location.search).get('n') || 99);
  const items = (show === 'ops' ? OP_LIST : GAD).slice(from, from + n), cols = show === 'ops' ? (n < 20 ? 6 : 13) : 8, rows = Math.ceil(items.length / cols);
  const cw = W / cols, ch = H / rows, Z = Math.min(cw, ch) / (show === 'ops' ? 34 : 48);
  items.forEach((it, i) => {
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = (i + Math.floor(i / cols)) % 2 ? '#30312e' : '#2a2b28'; ctx.fillRect(x, y, cw, ch);
    ctx.fillStyle = '#dfe6e0'; ctx.fillText(show === 'ops' ? OPERATORS[it].name : it.label, x + 6, y + 14);
    if (show === 'ops') {
      ctx.setTransform(Z, 0, 0, Z, x + cw / 2, y + ch / 2 + 6);
      setPersp({ x: 0, y: EYE }, PH);
      drawOperator(ctx, { hang: POSE === 'hang' ? 'up' : POSE === 'inv' ? 'inv' : null, wallA: POSE === 'hang' || POSE === 'inv' ? AIM : undefined, x: 0, y: 0, aim: POSE === 'hang' || POSE === 'inv' ? AIM + 0.7 : AIM, op: it, w: OPERATORS[it].primary, ally: OPERATORS[it].team === 'def', walk: QP.get('walk') ? t * 8 : 0, legs: 1, crouch: POSE === 'crouch', prone: POSE === 'prone', lean: POSE === 'lean' ? 1 : 0, up: +QP.get('up') || 0 }, t);
      setPersp({ x: 0, y: 0 }, 0);
    } else {
      for (const [k, ally] of [[0.3, true], [0.7, false]]) {
        ctx.setTransform(Z, 0, 0, Z, x + cw * k, y + ch / 2 + 6);
        drawGadget(ctx, { ...it.e, x: 0, y: 0 }, t, ally);
      }
    }
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
