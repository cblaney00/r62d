<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R62D build progress</title>
<style>
  :root { --bg: #0d1117; --panel: #161c25; --line: #263040; --text: #dfe6ef; --dim: #7f8b9b; --blue: #3d8bff; --gold: #f0b43c; --green: #3ccf7a; --red: #ff5a4f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; padding: 22px 26px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
  .sub { color: var(--dim); margin: 4px 0 18px; font-size: 13px; }
  .bar { height: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; position: relative; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), #7fb5ff); transition: width .6s ease; }
  .fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); width: 30%; animation: sheen 2.4s linear infinite; }
  @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
  .nums { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; margin: 6px 0 18px; }
  .now { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; }
  .now b { display: block; font-size: 17px; }
  .now span { color: var(--dim); font-size: 13px; }
  ol { list-style: none; margin: 0 0 18px; padding: 0; }
  li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .ic { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); margin-top: 1px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  li.done .ic { background: var(--green); border-color: var(--green); color: #06210f; }
  li.doing .ic { border-color: var(--gold); border-top-color: transparent; animation: spin 1s linear infinite; }
  li.fail .ic { background: var(--red); border-color: var(--red); color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  li .n { font-weight: 600; } li.todo .n { color: var(--dim); }
  li .d { color: var(--dim); font-size: 12.5px; }
  li .t { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }
  .log { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; height: 150px; overflow-y: auto; font: 12.5px/1.5 ui-monospace, monospace; color: #b8c3d1; }
  .log div span { color: var(--dim); margin-right: 8px; }
</style>
</head>
<body>
<h1 id="title">R62D build progress</h1>
<div class="sub" id="sub">Waiting for the first step…</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="nums"><span id="count"></span><span id="elapsed"></span></div>
<div class="now" id="now"><b>—</b><span></span></div>
<ol id="steps"></ol>
<h2>What's happening</h2>
<div class="log" id="log"></div>
<script>
  const $ = id => document.getElementById(id);
  const mins = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s'; };
  const clock = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  let p = null, lastLog = 0;
  function render() {
    if (!p) return;
    $('title').textContent = p.title;
    const done = p.steps.filter(s => s.state === 'done').length, doing = p.steps.find(s => s.state === 'doing' || s.state === 'fail');
    $('fill').style.width = (100 * (done + (doing ? 0.4 : 0)) / p.steps.length) + '%';
    $('count').textContent = `${done} of ${p.steps.length} steps done`;
    $('elapsed').textContent = p.started ? 'Working for ' + mins(Date.now() - p.started) : '';
    $('sub').textContent = done === p.steps.length ? 'All done! This window can be closed.' : p.updated ? 'Last update ' + clock(p.updated) : 'Waiting for the first step…';
    $('now').querySelector('b').textContent = doing ? 'Now: ' + doing.name : done === p.steps.length ? 'Finished' : 'Up next: ' + (p.steps.find(s => s.state === 'todo') || {}).name;
    $('now').querySelector('span').textContent = doing ? (doing.detail || doing.about) : '';
    $('steps').innerHTML = p.steps.map((s, i) => `<li class="${s.state}"><div class="ic">${s.state === 'done' ? '✓' : s.state === 'fail' ? '!' : s.state === 'todo' ? i + 1 : ''}</div>
      <div><div class="n">${s.name}</div><div class="d">${s.detail || s.about}</div></div>
      <div class="t">${s.state === 'done' && s.began ? mins(s.ended - s.began) : s.state === 'doing' ? mins(Date.now() - s.began) : ''}</div></li>`).join('');
    if (p.updated !== lastLog) {
      lastLog = p.updated;
      $('log').innerHTML = p.log.map(l => `<div><span>${clock(l.at)}</span>${l.text}</div>`).join('');
      $('log').scrollTop = 1e9;
    }
  }
  async function poll() {
    try { p = await (await fetch('/progress.json?' + Date.now())).json(); } catch {}
    render();
  }
  poll(); setInterval(poll, 1500); setInterval(render, 1000);
</script>
</body>
</html>
