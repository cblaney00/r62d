<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>R62D</title>
<!-- The Android app's start page (android/README.md). PLAY ON THIS PHONE plays the whole game with no computer (the app
     serves the game's files and its server runs in the page). JOIN finds R62D games on the phone's networks (home Wi-Fi,
     the homelab VPN) or takes a friend's HOST code. Phones can't host: a computer does. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ally: #3aa0ff; --gold: #f2c14e; --text: #eef2f5; --dim: #93a0ad; --line: rgba(255,255,255,.12); --panel: rgba(10,13,18,.82);
    --head: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'Barlow', 'Roboto', sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text); font-family: var(--body); user-select: none;
    background: radial-gradient(ellipse at 30% 30%, #13202e 0%, #070a0e 60%, #030405 100%); }
  body::before { content: ''; position: fixed; inset: 0; opacity: .5; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 32px), repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 32px); }
  main { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 28px;
    padding: max(20px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) 20px max(28px, env(safe-area-inset-left)); }
  .left { display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0; }
  h1 { margin: 0; font: 800 min(96px, 19vh)/0.9 var(--head); letter-spacing: .1em; }
  h1 small { display: block; font: 600 15px var(--head); letter-spacing: .45em; color: var(--dim); margin-top: 10px; }
  .left p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
  .right { display: flex; flex-direction: column; gap: 10px; min-height: 0; justify-content: center; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .box h2 { margin: 0; font: 700 24px var(--head); letter-spacing: .14em; display: flex; justify-content: space-between; align-items: center; }
  button { font: 700 20px var(--head); letter-spacing: .14em; color: var(--text); background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; }
  button:active { filter: brightness(1.3); } button:disabled { opacity: .5; }
  button.blue { background: var(--ally); color: #000; border-color: var(--ally); }
  button.gold { background: var(--gold); color: #000; border-color: var(--gold); font-size: 26px; padding: 12px; }
  .box.main { border-color: rgba(242,193,78,.45); }
  #pack { color: var(--dim); font-size: 12.5px; margin: 0; } #pack a { color: var(--gold); }
  button.small { font-size: 15px; padding: 6px 12px; }
  .typed { display: flex; gap: 8px; }
  .typed input { flex: 1; min-width: 0; font: 700 22px var(--head); letter-spacing: .12em; text-transform: uppercase; color: var(--text); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; outline: none; user-select: text; }
  .typed input:focus { border-color: var(--ally); }
  #games { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 24vh; }
  .game { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; text-align: left; padding: 9px 14px; font-family: var(--body); letter-spacing: 0; }
  .game b { font: 700 20px var(--head); letter-spacing: .08em; }
  .game span { color: var(--dim); font-size: 12.5px; grid-column: 1; }
  .game i { font-style: normal; grid-row: 1 / 3; grid-column: 2; font: 700 17px var(--head); letter-spacing: .12em; color: var(--ally); }
  .game.lab { border-color: rgba(242,193,78,.5); } .game.lab i { color: var(--gold); }
  #hint { color: var(--dim); font-size: 13px; margin: 0; }
  #msg { min-height: 20px; color: var(--gold); font: 600 16px var(--head); letter-spacing: .06em; }
  #msg.bad { color: #ff7a6a; }
  footer { position: fixed; left: max(28px, env(safe-area-inset-left)); right: max(28px, env(safe-area-inset-right)); bottom: 10px; display: flex; justify-content: space-between; color: var(--dim); font: 500 13px var(--head); letter-spacing: .1em; }
  footer a { color: var(--dim); padding: 6px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--dim); border-top-color: transparent; border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="left">
    <h1>R62D<small>TACTICAL OPERATIONS</small></h1>
    <p>Play on your own against bots, free play or the tutorial, no computer needed. Or join friends in a game hosted on a computer (on the computer, press <b>HOST</b> in the lobby to see its code).</p>
    <div id="msg"></div>
  </div>
  <div class="right">
    <div class="box main">
      <button class="gold" id="play">PLAY ON THIS PHONE</button>
      <p id="pack"></p>
    </div>
    <div class="box">
      <h2>JOIN WITH A CODE</h2>
      <div class="typed"><input id="addr" placeholder="CODE" spellcheck="false" autocomplete="off" autocapitalize="characters"><button class="blue" id="typedGo">JOIN</button></div>
    </div>
    <div class="box">
      <h2>GAMES NEARBY <button class="small" id="again">LOOK AGAIN</button></h2>
      <p id="hint"></p>
      <div id="games"></div>
    </div>
  </div>
</main>
<footer><span id="ver"></span><a id="quit">QUIT</a></footer>
<script>
/*JOINCODE*/
const $ = id => document.getElementById(id), A = window.r62dApp || { nets: () => new URLSearchParams(location.search).get('nets') || '', version: () => 'test', exit: () => {}, play: () => {}, pack: () => '{"n":1,"version":"test","status":"Game up to date"}' }; // (the stub is for testing in a browser)
const PORT = 6262, HOMELAB = 'http://192.168.1.76:6262'; // Lando's homelab server (on the VPN)
const say = (t, bad) => { $('msg').textContent = t; $('msg').classList.toggle('bad', !!bad); };
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };

// is there an R62D game at this address? → its /api/addr answer, else null
async function info(url, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url + '/api/addr', { signal: c.signal, cache: 'no-store' }); const a = r.ok ? await r.json() : null; return a && a.version ? a : null; }
  catch { return null; } finally { clearTimeout(t); }
}

function go(url, name) {
  say('Joining ' + (name || url.replace(/^http:\/\//, '')) + '…');
  store('r62d-last', url);
  location.href = url + '/';
}

// every address worth asking: the last game joined, Lando's homelab, then every address on each of the phone's
// networks (the VPN passes no broadcasts, so each one is asked; only the /24 round the phone's own address)
function targets() {
  const out = new Set(), mine = new Set();
  const last = store('r62d-last'); if (last) out.add(last);
  out.add(HOMELAB);
  for (const n of String(A.nets() || '').split(/\s+/).filter(Boolean)) {
    const [ip, pre] = n.split('/'); mine.add(ip);
    if (+pre < 16 || +pre > 30) continue;
    const base = ip.split('.').slice(0, 3).join('.');
    for (let i = 1; i < 255; i++) if (base + '.' + i !== ip) out.add(`http://${base}.${i}:${PORT}`);
  }
  return [...out];
}

let looking = 0;
async function look() {
  const run = ++looking, found = new Map();
  $('games').innerHTML = ''; $('again').disabled = true;
  $('hint').innerHTML = '<span class="spin"></span>Looking for games…';
  const list = targets();
  const show = () => {
    const g = [...found.values()].sort((a, b) => b.lab - a.lab || b.players - a.players);
    $('games').innerHTML = g.map((x, i) => `<button class="game${x.lab ? ' lab' : ''}" data-u="${esc(x.url)}" data-n="${esc(x.name)}"><b>${esc(x.name)}</b>
      <span>${x.players ? x.players + (x.players === 1 ? ' player' : ' players') + ' in the lobby' : 'Nobody in the lobby yet'} · ${esc(x.url.replace(/^http:\/\//, ''))}</span><i>JOIN</i></button>`).join('');
    for (const b of $('games').children) b.onclick = () => go(b.dataset.u, b.dataset.n);
  };
  const ask = async url => {
    const a = await info(url, url === HOMELAB ? 2500 : 1500);
    if (!a || run !== looking) return;
    const lab = url === HOMELAB, name = lab ? 'Lando\'s homelab' : a.host || url;
    if (!lab && [...found.values()].some(g => g.lab) && a.host === 'mini-server') return; // the homelab answering from its own address
    if (!lab && [...found.values()].some(g => !g.lab && g.name === name)) return; // one computer answers on each of its addresses: list it once
    found.set(url, { url, name, players: a.players || 0, lab }); show();
  };
  for (let i = 0; i < list.length; i += 64) { await Promise.all(list.slice(i, i + 64).map(ask)); if (run !== looking) return; }
  $('again').disabled = false;
  $('hint').textContent = found.size ? 'Tap a game to join it.'
    : 'No games found. Is a computer hosting (HOST in its lobby)? Same Wi-Fi as this phone, or Lando\'s VPN on?';
}

async function typedGo() {
  const t = $('addr').value.trim(); if (!t) return;
  const r = readCode(t);
  if (!r) return say(/[.:]/.test(t) ? 'That doesn\'t look like an address.' : 'That code isn\'t right. Check each letter with your friend.', true);
  const url = `http://${r.ip}:${r.port}`;
  say('Looking for the game…');
  if (!(await info(url, 5000))) return say(`No R62D game answered at ${r.ip}. Same Wi-Fi, or Lando's VPN on?`, true);
  go(url);
}
$('typedGo').onclick = typedGo;
$('addr').onkeydown = e => { if (e.key === 'Enter') { $('addr').blur(); typedGo(); } };
$('again').onclick = look;
$('quit').onclick = () => A.exit();
$('play').onclick = () => { say('Starting…'); A.play(); };
// which game is on this phone, and how the update check went (the app calls onPack when that changes)
window.onPack = () => {
  let p = {}; try { p = JSON.parse(A.pack()); } catch {}
  const apk = 'https://github.com/cblaney00/r62d/releases/latest/download/R62D-android.apk';
  $('pack').innerHTML = 'Game build ' + esc(p.n || '?') + (p.status ? ' · ' + esc(p.status) : '') + (p.needApp ? ` · <a href="${apk}">get the new app</a>` : '');
};
onPack();
$('ver').textContent = 'ANDROID APP ' + (A.version() || '');
const lost = new URLSearchParams(location.search).get('lost');
if (lost) say(`Lost the game at ${lost}. It may have closed.`, true);
look();
</script>
</body>
</html>
